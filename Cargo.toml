[package]
name = "hecate"
version = "0.1.0"
edition = "2024"

[dependencies]
toml = "1.1.6"
clap = { version = "4.6.7", features = ["derive"] }
tree-sitter = "0.27.1"
tree-sitter-rust = "0.24.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cap-std = "3.4.5"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
flate2 = "1"
tar = "0.4"
